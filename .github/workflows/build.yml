name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · MSVC 2022
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-studio-windows-x64
          path: build/Release/note-studio.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android · arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125'

      - name: Export Android SDK paths
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt Android kit
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          install-deps: true
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-23
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-android --parallel

      - name: Sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk="build-android/android-build/build/outputs/apk/release/android-build-release-unsigned.apk"
          signed_apk="build-android/android-build/build/outputs/apk/release/note-studio-android-arm64-signed.apk"
          keystore="$RUNNER_TEMP/note-studio-signing.jks"
          test -f "$unsigned_apk"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            key_alias="$ANDROID_KEY_ALIAS"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured; generating a temporary debug signing key for this CI artifact. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD for stable release signing."
            key_alias="androiddebugkey"
            store_password="android"
            key_password="android"
            keytool -genkeypair -noprompt -keystore "$keystore" -storepass "$store_password" -keypass "$key_password" \
              -alias "$key_alias" -dname "CN=Note Studio CI,O=Note Studio,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$key_alias" \
            --ks-pass "pass:$store_password" --key-pass "pass:$key_password" \
            --out "$signed_apk" "$unsigned_apk"
          "$apksigner" verify --verbose "$signed_apk"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/note-studio-signing.jks"

      - name: Upload signed Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-studio-android-arm64-signed
          path: build-android/android-build/build/outputs/apk/release/note-studio-android-arm64-signed.apk
          if-no-files-found: error
          retention-days: 14
